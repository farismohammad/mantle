[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mantle-agent-cli"
version = "0.1.0"
description = "Create and run isolated Pi agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
mantle = "mantle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mantle"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
