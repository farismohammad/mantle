# Written by `mantle cloud start`; changes here are replaced on the next start.
# The values, including the Compose project name, come from the .env file next
# to this one. This matches the docker-compose.yml published with each Mantle
# Cloud release.

services:
  mantle-cloud:
    image: ${MANTLE_CLOUD_IMAGE:-ghcr.io/farismohammad/mantle-web}:${MANTLE_CLOUD_VERSION:-0.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANTLE_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      MANTLE_DATA_DIR: /data
    volumes:
      - mantle_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  mantle_data:
